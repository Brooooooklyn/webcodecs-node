allowBuilds:
  node-av: true
  '@seydx/node-av-darwin-arm64': true
  '@seydx/node-av-darwin-x64': true
  '@seydx/node-av-linux-arm64': true
  '@seydx/node-av-linux-x64': true
  '@seydx/node-av-win32-arm64-mingw': true
  '@seydx/node-av-win32-arm64-msvc': true
  '@seydx/node-av-win32-x64-mingw': true
  '@seydx/node-av-win32-x64-msvc': true
  esbuild: true
# pnpm 12 resolves the physical CPU (arm64) even under Rosetta, but the
# x86_64-apple-darwin test job runs x64 Node on arm64 runners and needs
# x64 variants of platform packages (node-av, esbuild) installed.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
minimumReleaseAgeExclude:
  - '@emnapi/*'
  - '@napi-rs/*'
  - '@oxc-node/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - emnapi
  - oxfmt
  - oxlint
  - oxlint-tsgolint
