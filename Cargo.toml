[workspace]
members = ["crates/pixel-simd", "tools/build-ffmpeg"]

[package]
name = "webcodecs-node"
version = "0.1.0"
edition = "2024"
authors = ["LongYinan <lynweklm@gmail.com>"]
description = "WebCodecs API implementation for Node.js using FFmpeg"
license = "MIT"
repository = "https://github.com/Brooooooklyn/webcodecs-node"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.15.0", features = ["async", "napi7", "web_stream"] }
napi-derive = { version = "3.6.13" }

futures = "0.3"

# Async runtime
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

# Error handling
thiserror = "2"

# Concurrent data structures
crossbeam = "0.8"

# Better RwLock implementation (no poisoning, better perf)
parking_lot = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }

# Pixel loops with SIMD paths
pixel-simd = { path = "crates/pixel-simd" }

# Host functions (libuv) looked up at run time, as napi-sys looks up Node-API
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.9"

[dev-dependencies]
sha2 = "0.11.0"

[build-dependencies]
napi-build = "2.6.0"
cc = "1"
sha2 = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
# Faster builds during development
opt-level = 0

[features]
default = []
